name: Update Frontend NPM Dependencies

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frontend-dependency-updates
  cancel-in-progress: false

jobs:
  update-frontend-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 24 bundles npm 11. The npm 10.8.2 that ships with Node 20
          # crashes in arborist (#loadPeerSet, "reading 'edgesOut'") when an
          # optional peer chain under vite has a version skew, which broke this
          # job from 2026-10-19. npm-check-updates 23 also declares
          # engines node ^22.22.2 || ^24.15.0 || >=26.0.0.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Update frontend package manifest
        working-directory: frontend
        run: npx npm-check-updates@latest -u

      - name: Refresh frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only

      - name: Install refreshed dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify updated frontend dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm run build

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          commit-message: "chore: update frontend npm dependencies"
          title: "chore: update frontend npm dependencies"
          body: |
            ## Summary
            - update frontend npm dependency ranges to the latest available releases
            - regenerate the frontend lockfile
            - verify the updated dependencies still pass audit and build checks
          branch: automation/update-frontend-npm-dependencies
          delete-branch: true
